name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  OktaMobileSwift:
    url: https://github.com/okta/okta-mobile-swift
    from: "1.8.0"
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources: [AcmeBank]
    resources: [AcmeBank/Resources]
    dependencies:
      - package: OktaMobileSwift
        product: OktaDirectAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        INFOPLIST_FILE: AcmeBank/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # NOTE: CODE_SIGN_ENTITLEMENTS intentionally omitted.
        # On the CI simulator build (CODE_SIGNING_ALLOWED=NO) the
        # $(AppIdentifierPrefix) token in keychain-access-groups is
        # never substituted, leaving a malformed access-group entitlement
        # that causes secd to reject every SecItem* call with
        # errSecMissingEntitlement (-34018). KeychainStore queries set
        # kSecUseDataProtectionKeychain: true, so items round-trip
        # through the simulator's default per-bundle-ID access group
        # cleanly without an explicit entitlements file. A future
        # signed-device build path can re-apply the entitlements file
        # via a separate xcconfig / build configuration.
    postBuildScripts:
      - name: Inject Okta Config from Env Vars
        # Bridges OKTA_* env vars from the calling shell into the built
        # Info.plist via `plutil`. Never hard-fails on missing env vars —
        # writes a sentinel that the runtime `OktaConfig` detects and
        # surfaces as `.notConfigured(reason:)`. See README "Okta build
        # configuration" for env-var setup.
        #
        # Invoked via `bash` (not as a direct executable) so the script's
        # executable bit on disk is irrelevant — git on some filesystems
        # drops filemode, which previously caused "Permission denied"
        # when xcodebuild tried to exec the path directly.
        script: |
          bash "${SRCROOT}/AcmeBank/Configuration/InjectOktaConfig.sh"
        inputFiles:
          - $(SRCROOT)/AcmeBank/Configuration/InjectOktaConfig.sh
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  AcmeBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AcmeBankUITests]
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  AcmeBank:
    build:
      targets: { AcmeBank: all }
    test:
      targets: [AcmeBankTests, AcmeBankUITests]
      parallelizable: false
